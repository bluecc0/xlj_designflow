<style>
  :root {
    --bg: oklch(0.985 0.003 260);
    --panel: #ffffff;
    --panel-2: oklch(0.975 0.004 260);
    --line: oklch(0.92 0.005 260);
    --line-2: oklch(0.95 0.005 260);
    --ink: oklch(0.18 0.01 260);
    --ink-2: oklch(0.38 0.01 260);
    --ink-3: oklch(0.58 0.008 260);
    --accent: oklch(0.55 0.22 275);
    --accent-soft: oklch(0.96 0.03 275);
    --accent-ink: oklch(0.38 0.18 275);
    --warn: oklch(0.72 0.15 70);
    --ok: oklch(0.65 0.15 155);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --shadow-1: 0 1px 2px rgba(20,22,40,0.04), 0 1px 1px rgba(20,22,40,0.03);
    --shadow-2: 0 6px 24px rgba(20,22,40,0.06), 0 1px 2px rgba(20,22,40,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; letter-spacing: -0.005em; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', serif; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.88 0.005 260); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.80 0.008 260); border: 3px solid transparent; background-clip: padding-box; }
</style>
</head>

<script type="text/babel" src="src/Icons.jsx" data-presets="react">
// Minimal stroke icon set
const Icon = ({ d, size = 14, stroke = 1.5, fill = 'none', children, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={style}>
    {d ? <path d={d} /> : children}
  </svg>
);

const I = {

<script type="text/babel" src="src/Utils.jsx" data-presets="react">
// Striped / gradient placeholder imagery. No hand-drawn illustrations.

const hashHue = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h) % 360;
};

const Stripe = ({ label, ratio = '4/5', tone = 'neutral', seed = 'x', tag }) => {
  const hue = tone === 'accent' ? 275 : tone === 'warm' ? 40 : hashHue(seed);
  const light = tone === 'accent' ? 0.92 : 0.96;
  const light2 = tone === 'accent' ? 0.88 : 0.93;
  return (
    <div style={{
      aspectRatio: ratio,
      position: 'relative',
      borderRadius: 8,
      overflow: 'hidden',
      background: `repeating-linear-gradient(135deg, oklch(${light} 0.02 ${hue}) 0 8px, oklch(${light2} 0.025 ${hue}) 8px 16px)`,
      border: '1px solid var(--line-2)',
    }}>
      {label && (
        <div className="mono" style={{
          position: 'absolute', left: 8, top: 8,
          fontSize: 9, letterSpacing: '0.02em',
          color: `oklch(0.45 0.05 ${hue})`,
          textTransform: 'uppercase',
        }}>{label}</div>
      )}
      {tag && (
        <div style={{
          position: 'absolute', right: 8, bottom: 8,
          fontSize: 10, color: `oklch(0.35 0.05 ${hue})`,
          background: 'rgba(255,255,255,0.85)',
          backdropFilter: 'blur(4px)',
          padding: '2px 6px', borderRadius: 4,
        }}>{tag}</div>
      )}
    </div>
  );
};

const Swatch = ({ color, label }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 4, minWidth: 0 }}>
    <div style={{ height: 28, borderRadius: 6, background: color, border: '1px solid rgba(0,0,0,0.05)' }}/>
    <div className="mono" style={{ fontSize: 9, color: 'var(--ink-3)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{label}</div>
  </div>
);

window.Stripe = Stripe;
window.Swatch = Swatch;

</script>

// Polls /health every 30s and renders compact status icons.

const STATUS_COLORS = {
  loading: 'var(--warn)',
  ok: 'var(--ok)',
  err: 'oklch(0.6 0.18 25)',
};

const StatusIcon = ({ title, fetchUrl, okKey, icon: Icon, renderDetail, placement = 'bottom' }) => {
  const [status, setStatus] = React.useState('loading'); // 'loading' | 'ok' | 'err'
  const [payload, setPayload] = React.useState(null);
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    let alive = true;
    const check = async () => {
      try {
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (!alive) return;
        setPayload(data);
        if (okKey) {
          setStatus(data[okKey]?.connected ? 'ok' : 'err');
        } else {
          const ok = data.status === 'ok' && data.penpot?.connected;
          setStatus(ok ? 'ok' : 'err');
        }
      } catch {
        if (alive) {
          setPayload(null);
          setStatus('err');
        }
      }
    };
    check();
    const iv = setInterval(check, 30000);
    return () => {
      alive = false;
      clearInterval(iv);
    };
  }, [fetchUrl, okKey]);

  React.useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (!wrapRef.current || wrapRef.current.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [open]);

  const color = STATUS_COLORS[status] || STATUS_COLORS.err;
  const pulse = status === 'loading';
  const text = status === 'loading' ? '检测中' : status === 'ok' ? '正常' : '异常';
  const detail = renderDetail ? renderDetail(payload) : null;
  const clickable = Boolean(detail);

  return (
    <div
      ref={wrapRef}
      style={{
        position: 'relative',
        flexShrink: 0,
      }}

      <button
        title={title + '：' + text}

};

﻿const CATS = ['All', 'Social', 'E-commerce', 'Brand', 'Print', 'Web', 'Packaging'];

function formatAiModelName(model) {
  if (!model) return 'AI 生图';
  var map = {
    'gpt-image-2': 'Gpt image 2',
    'gemini-3-pro-image-preview': 'Nano Banano pro',
  };
  return map[model] || model;
}

// 从后端 TemplateInfo 推导显示用的 cat / ratio / tone / tag
function deriveTemplateMeta(t) {
  const { width = 400, height = 400, slots = [] } = t;
  const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
  const g = gcd(Math.round(width), Math.round(height));
  const ratio = (width / g) + '/' + (height / g);
  const productSlots = (slots || []).filter(function(s) {
    return (s.name || '').replace(/ /g, '').startsWith('slot/product_');
  });
  const uniqGroups = new Set(productSlots.map(function(s) { return (s.name || '').split('/')[1]; })).size;
  return {

  const iframeRef = React.useRef(null);
  const editorReadyRef = React.useRef(false);
  const pendingMessageRef = React.useRef(null);
  const [iframeNonce, setIframeNonce] = React.useState(0);
  const [editorInsertState, setEditorInsertState] = React.useState(null);

  const postToEditor = React.useCallback((message) => {
    const win = iframeRef.current && iframeRef.current.contentWindow;
    if (!win) return false;
    win.postMessage(message, '*');
    return true;
  }, []);

  const markEditorReady = React.useCallback(() => {
    editorReadyRef.current = true;
    if (pendingMessageRef.current) {
      postToEditor(pendingMessageRef.current);
      pendingMessageRef.current = null;
    }
  }, [postToEditor]);

  // 接收编辑器的 ready 信号，用于命令就绪判定（不控制 UI 可见性）
  React.useEffect(() => {
    const handleMessage = (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'designflow:editor-ready') {
        markEditorReady();
      } else if (data.type === 'designflow:editor-inserted') {
        setEditorInsertState({ status: 'done', message: '已放入画布' });
      } else if (data.type === 'designflow:editor-error') {
        setEditorInsertState({ status: 'failed', message: data.message || '放入画布失败' });
      } else if (data.type === 'designflow:use-as-reference') {
        const images = Array.isArray(data.images) ? data.images.filter(function(item) {
          return item && typeof item.src === 'string' && item.src.trim();
        }) : [];
        if (onUseReferenceImages) {
          onUseReferenceImages(images);
        }
      }
    };
    window.addEventListener('message', handleMessage);

    // 主动 ping iframe，解决缓存加载时序导致的 ready 消息丢失
    let pingCount = 0;
    const ping = () => {
      pingCount++;
      postToEditor({ type: 'designflow:ping' });
      if (pingCount < 30 && !editorReadyRef.current) {
        setTimeout(ping, 400);
      }
    };
    setTimeout(ping, 200);

    return () => window.removeEventListener('message', handleMessage);
  }, [markEditorReady, onUseReferenceImages, postToEditor]);

  React.useEffect(() => {
    editorReadyRef.current = false;
  }, [iframeNonce, t && t.id]);

  React.useEffect(() => {
    if (!editorCommand) return;
    const message = editorCommand.type === 'insert-images'
      ? {
          type: 'designflow:insert-image',
          urls: editorCommand.urls || [],
          mode: editorCommand.mode,
          name: editorCommand.name,
        }
      : {
          type: 'designflow:new-canvas',
          pageName: editorCommand.pageName || t?.name || '画板 1',
        };

    if (editorCommand.type === 'insert-images') {
      setEditorInsertState({ status: 'running', message: '正在放入画布' });
    }

    if (editorReadyRef.current) {
      postToEditor(message);
    } else {
      pendingMessageRef.current = message;
      postToEditor({ type: 'designflow:ping' });
    }

    if (editorCommand.type === 'insert-images') {
      const timer = setTimeout(() => {
        setEditorInsertState((prev) => {
          if (!prev || prev.status !== 'running') return prev;
          return { status: 'failed', message: '放入画布超时，请刷新后重试' };
        });
      }, 60000);
      return () => clearTimeout(timer);
    }
  }, [editorCommand, postToEditor, t]);

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0,
      overflow: 'hidden',
      background: 'var(--panel-2)',
    }}>
      <div style={{
        height: 44, flexShrink: 0,
        borderBottom: '1px solid var(--line)',
        display: 'flex', alignItems: 'center',
        padding: '0 16px', gap: 10,
        background: 'var(--panel)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
          <span className="mono" style={{ color: 'var(--ink-3)', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em' }}>编辑器</span>
          <span style={{ color: 'var(--ink)', fontWeight: 500 }}>{t?.name || '空白画布'}</span>
          {hasResult && (
            <span className="mono" style={{ fontSize: 10, color: 'var(--ok)', padding: '2px 6px', borderRadius: 4, background: 'rgba(0,128,96,0.08)', border: '1px solid rgba(0,128,96,0.16)' }}>
              已接收结果图
            </span>
          )}
          {editorInsertState && (
            <span
              className="mono"
              title={editorInsertState.message}
              style={{
                fontSize: 10,
                color: editorInsertState.status === 'failed' ? 'var(--warn)' : (editorInsertState.status === 'done' ? 'var(--ok)' : 'var(--ink-3)'),
                padding: '2px 6px',
                borderRadius: 4,
                background: editorInsertState.status === 'failed' ? 'rgba(180,35,24,0.08)' : 'rgba(0,128,96,0.08)',
                border: editorInsertState.status === 'failed' ? '1px solid rgba(180,35,24,0.16)' : '1px solid rgba(0,128,96,0.16)',
              }}
            >
              {editorInsertState.message}
            </span>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {window.lastComposeJobId && (
            <button
              onClick={() => {
                const frames = (resultTemplate && resultTemplate._frameNames) || ((resultTemplate?.frames || []).map(f => f.name || f.variant || '画板'));
                const names = frames.join(',');
                const ep = window.lastComposeEndpoint || '/special-compose';
                window.open(`${ep}/${window.lastComposeJobId}/download-zip?names=${encodeURIComponent(names)}`, '_blank');
              }}
              style={canvasActionSecondaryStyle}
            >
              打包下载
            </button>
          )}
          {window.resultPenpotUrl && (
            <button onClick={() => window.open(window.resultPenpotUrl, '_blank')} style={canvasActionSecondaryStyle}>
              Penpot
            </button>
          )}
        </div>
      </div>

      <div style={{ flex: 1, minHeight: 0, position: 'relative', background: 'oklch(0.98 0.003 260)' }}>
        <iframe
          key={iframeNonce}
          ref={iframeRef}
          src="/editor-beta/index.html"
          title="Designflow Editor"
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none', background: 'transparent' }}
        />
      </div>
    </div>
  );
};

const canvasActionPrimaryStyle = {
  fontSize: 12,
  padding: '6px 14px',
  borderRadius: 6,
  background: 'var(--ink)',
  color: 'white',
  border: '1px solid var(--ink)',

};

const canvasActionSecondaryStyle = {
  fontSize: 12,
  padding: '6px 14px',
  borderRadius: 6,

  border: '1px solid var(--line)',

};

// 结果展示：用 TemplatePreview 相同的 FrameThumb 布局渲染（结果看起来和模板预览完全一致）
const ResultPreview = ({ t }) => {
  const stageRef = React.useRef(null);
  const [box, setBox] = React.useState({ w: 560, h: 480 });
  React.useEffect(() => {
    if (!stageRef.current) return;
    const ro = new ResizeObserver(entries => {
      for (const e of entries) {
        const { width, height } = e.contentRect;
        setBox({ w: Math.max(200, width - 80), h: Math.max(200, height - 120) });
      }
    });
    ro.observe(stageRef.current);
    return () => ro.disconnect();
  }, []);

  // 多画板：frames 数组；单画板：frames 为空，用 t 本身
  const frames = (t.frames && t.frames.length > 0) ? t.frames : [t];
  const isMulti = frames.length > 1;
  const perMaxW = isMulti ? Math.floor((box.w - (frames.length - 1) * 24) / frames.length) : box.w;
  const perMaxH = isMulti ? box.h - 60 : box.h - 40;
  const cat = t.cat;

  return (
    <div ref={stageRef} style={{ position: 'absolute', inset: 0, overflow: isMulti ? 'auto' : 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>

      <div style={{ display: 'flex', flexDirection: 'row', gap: 24, alignItems: 'flex-end', flexWrap: 'wrap', justifyContent: 'center' }}>
        {frames.map((frame, i) => {
          const variantLabel = frame.variant || (isMulti ? frame.name : '');
          // 用 resultUrl 替代 thumbnail
          const resultUrl = frame.resultUrl;
          return React.createElement(FrameThumb, {
            key: frame.id,
            frame: Object.assign({}, frame, {

            }),
            maxW: perMaxW,
            maxH: perMaxH,
            label: variantLabel,
            hd: false,

      </div>

      {/* 操作栏 */}
        <div style={{
          display: 'flex', gap: 8, padding: '8px 12px',
          background: 'rgba(255,255,255,0.95)',
          borderRadius: 8,
          boxShadow: '0 4px 16px rgba(0,0,0,0.12)',
          flexWrap: 'wrap', justifyContent: 'center',
        }}>
        {window.lastComposeJobId && (
          <button
            onClick={() => {
              const names = (t._frameNames || frames.map(f => f.name || f.variant || '')).join(',');
              const ep = window.lastComposeEndpoint || '/special-compose';
              window.open(`${ep}/${window.lastComposeJobId}/download-zip?names=${encodeURIComponent(names)}`, '_blank');
            }}
            style={canvasActionPrimaryStyle}
          >
            打包下载
          </button>
        )}
        {window.resultPenpotUrl && (
          <button
            onClick={() => window.open(window.resultPenpotUrl, '_blank')}
            style={canvasActionSecondaryStyle}
          >
            在Penpot中编辑
          </button>
        )}
      </div>
    </div>
    </div>
  );
};

// Translate ratio to pixel dimensions that fit nicely in the canvas area
const ratioToSize = (ratio, maxW, maxH) => {
  maxW = maxW || 560; maxH = maxH || 480;
  const [a, b] = ratio.split('/').map(Number);
  let w = maxW, h = (b / a) * maxW;
  if (h > maxH) { h = maxH; w = (a / b) * maxH; }
  return [Math.round(w), Math.round(h)];
};

// 从 API base url 推导 Penpot view URL
const getPenpotViewUrl = (fileId, pageId, frameId) => {
  // Penpot view-only 路由：/#/view/file-id/page-id?frame-id=xxx
  const base = (window.API && window.API.BASE) || window.location.origin;
  // Penpot 默认跑在 9001，API 跑在 8000，尝试从 hostname 拼出 penpot 地址
  let penpotOrigin;
  try {
    const u = new URL(base);
    penpotOrigin = u.protocol + '//' + u.hostname + ':9001';
  } catch(e) {
    penpotOrigin = window.location.protocol + '//' + window.location.hostname + ':9001';
  }
  return `${penpotOrigin}/#/view/${fileId}/${pageId}?frame-id=${frameId}&section=interactions&index=0`;
};

// 单个画板的预览卡片（主画布用 iframe 高清预览，缩略图模式用 img）
// resultUrl 存在时直接用该 URL（已缓存的结果图），不再调 API
const FrameThumb = ({ frame, maxW, maxH, label, hd = false, resultUrl = null }) => {
  const ratio = frame.ratio || (frame.width && frame.height ? (frame.width + '/' + frame.height) : '1/1');
  const [w, h] = ratioToSize(ratio, maxW, maxH);

  // hd 模式：嵌入 Penpot view iframe
  const [iframeReady, setIframeReady] = React.useState(false);
  const viewUrl = hd ? getPenpotViewUrl(frame.file_id, frame.page_id, frame.id) : null;

  // 非 hd：resultUrl 直接用；否则调 API 取缩略图
  const [src, setSrc] = React.useState(null);
  const [failed, setFailed] = React.useState(false);
  React.useEffect(() => {
    if (hd) return;
    setSrc(null); setFailed(false);
    if (resultUrl) {
      setSrc(resultUrl);
    } else {
      setSrc(window.API.getTemplateThumbnailUrl(frame.id, frame.page_id, frame.file_id));
    }
  }, [frame.id, frame.page_id, frame.file_id, hd, resultUrl]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
      <div style={{
        position: 'relative', width: w, height: h,
        background: 'white', borderRadius: 6,
        boxShadow: '0 30px 60px rgba(20,22,40,0.10), 0 4px 14px rgba(20,22,40,0.06), 0 0 0 1px var(--line)',
        overflow: 'hidden',
      }}>
        {hd ? (
          <>
            {!iframeReady && (
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8, color: 'var(--ink-3)', fontSize: 11 }}>
                <div style={{ width: 20, height: 20, borderRadius: 99, border: '2px solid var(--line)', borderTopColor: 'var(--accent)', animation: 'spin 0.8s linear infinite' }}/>
                <span>加载预览…</span>
              </div>
            )}
            <iframe
              src={viewUrl}
              style={{ width: '100%', height: '100%', border: 'none', display: iframeReady ? 'block' : 'none' }}
              onLoad={() => setIframeReady(true)}
              title={label || frame.name}
              sandbox="allow-scripts allow-same-origin"
            />
          </>
        ) : (
          src && !failed
            ? React.createElement('img', { src, alt: label, style: { width: '100%', height: '100%', objectFit: 'contain', background: 'white' }, onError: () => setFailed(true) })
            : React.createElement(Stripe, { ratio: w + '/' + h, tone: 'neutral', seed: frame.id, label: label, tag: ratio.replace('/', ':') })
        )}
        {!hd && <Handles/>}
      </div>
      {label && (
        <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          {label}
        </div>
      )}
    </div>
  );
};

const TemplatePreview = ({ t }) => {
  const stageRef = React.useRef(null);
  const [box, setBox] = React.useState({ w: 560, h: 480 });
  React.useEffect(() => {
    if (!stageRef.current) return;
    const ro = new ResizeObserver(entries => {
      for (const e of entries) {
        const { width, height } = e.contentRect;
        setBox({ w: Math.max(200, width - 80), h: Math.max(200, height - 120) });
      }
    });
    ro.observe(stageRef.current);
    return () => ro.disconnect();

  // 多画板：frames 数组；单画板：frames 为空，用 t 本身

  const isMulti = frames.length > 1;

  const cat = t.cat;

  return (

    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
      {/* 画板区：单画板居中，多画板横排 */}
      <div style={{ display: 'flex', flexDirection: 'row', gap: 24, alignItems: 'flex-end', flexWrap: 'wrap', justifyContent: 'center' }}>
        {frames.map((frame, i) => {
          const variantLabel = frame.variant || (isMulti ? frame.name : '');
          return React.createElement(FrameThumb, {
            key: frame.id,
            frame: Object.assign({}, frame, {
              ratio: frame.ratio || (frame.width && frame.height ? (frame.width + '/' + frame.height) : (t.ratio || '1/1')),
              file_id: frame.file_id || t.file_id,

      </div>

      {/* Meta strip */}

        boxShadow: 'var(--shadow-1)',
        fontSize: 11,
        flexWrap: 'wrap', justifyContent: 'center',
      }}>
        <span className="mono" style={{ color: 'var(--ink-3)' }}>{cat}</span>
        <span style={{ width: 3, height: 3, borderRadius: 99, background: 'var(--line)' }}/>
        <span className="mono" style={{ color: 'var(--ink-2)' }}>{(t.ratio || '').replace('/', ':')}</span>
        {isMulti && <>
          <span style={{ width: 3, height: 3, borderRadius: 99, background: 'var(--line)' }}/>
          <span className="mono" style={{ color: 'var(--ink-2)' }}>{frames.length} 个画板</span>
        </>}
        <span style={{ width: 3, height: 3, borderRadius: 99, background: 'var(--line)' }}/>
        <span className="mono" style={{ color: 'var(--ink-2)' }}>{Math.round(t.width)} × {Math.round(t.height)} px</span>
        <span style={{ width: 3, height: 3, borderRadius: 99, background: 'var(--line)' }}/>
        <span style={{ color: 'var(--ink-2)' }}>Ready for chat input</span>
      </div>
    </div>
    </div>
  );
};

const Handles = () => {
  const corners = [
    { top: -4, left: -4 }, { top: -4, right: -4 },
    { bottom: -4, left: -4 }, { bottom: -4, right: -4 },
  ];
  return (
    <>
      {corners.map((c, i) => (
        <div key={i} style={{
          position: 'absolute', ...c,

const EmptyCanvas = () => (
  <div style={{ textAlign: 'center', color: 'var(--ink-3)', fontSize: 13 }}>
  </div>

window.Canvas = Canvas;

</script>
<script type="text/babel" src="src/ChatExtras.jsx" data-presets="react">
// Slash commands, parse table, AI message list — additions to the chat surface.

const SLASH_COMMANDS = [
  { cmd: '/generate',   cn: '开始生图',   desc: 'Generate variations from current parameters', icon: 'zap',     shortcut: '⌘⏎',  group: 'Generation', available: false },
  { cmd: '/Nano Banana pro', cn: 'AI 生图',  desc: '图生图超强一致性，改图更强',          icon: 'image',   group: 'Generation', available: true },
  { cmd: '/Gpt image 2',    cn: 'AI 生图',  desc: '文生图，超强中文渲染和语义理解',      icon: 'image',   group: 'Generation', available: true },
  { cmd: '/花瓣下载',       cn: '花瓣下载',  desc: '输入项目id即可解析素材完成下载', icon: 'download', group: 'Tools', available: true },
  { cmd: '/转PSD',           cn: '图片分层',  desc: '上传图片后按描述重绘透明图层并合成 PSD', icon: 'layers',  group: 'Tools', available: false },
  { cmd: '/特殊品',        cn: '特殊品合成',      desc: '无素材特殊品模板',                   icon: 'grid',   group: 'Generation', available: true },
  { cmd: '/特殊品（完整）', cn: '特殊品（完整）合成', desc: '支持场景图，发售时间和立即抢购等多版本', icon: 'layers', group: 'Generation', available: true },

  { cmd: '/analyze',    cn: '分析素材',   desc: 'Parse an uploaded image, brief, or CSV',       icon: 'eye',     group: 'Tools', available: false },
  { cmd: '/palette',    cn: '提取配色',   desc: 'Extract a palette from a reference',            icon: 'palette', group: 'Tools', available: false },
  { cmd: '/resize',     cn: '换尺寸',     desc: 'Reflow the design into a new ratio',            icon: 'dims',    group: 'Tools', available: false },
  { cmd: '/copy',       cn: '换文案',     desc: 'Rewrite on-image copy',                         icon: 'type',    group: 'Tools', available: false },

  { cmd: '/export-png', cn: '导出PNG',    desc: 'Export selected option as PNG',                 icon: 'download', group: 'Export', available: false },
  { cmd: '/export-psd', cn: '导出PSD',    desc: 'Export with editable layers',                   icon: 'download', group: 'Export', available: false },
  { cmd: '/share',      cn: '分享链接',   desc: 'Generate a review link',                        icon: 'share',    group: 'Export', available: false },
];

const SlashMenu = ({ query, onPick, onClose }) => {
  const q = query.toLowerCase().replace(/^\//, '');
  const filtered = SLASH_COMMANDS.filter(c =>
    !q || c.cmd.includes(q) || c.cn.includes(query.replace(/^\//, '')) || c.desc.toLowerCase().includes(q)
  );

  const groups = filtered.reduce((acc, c) => {
    (acc[c.group] ||= []).push(c); return acc;
  }, {});

  const [hover, setHover] = React.useState(0);
  React.useEffect(() => setHover(0), [query]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); setHover(h => Math.min(filtered.length - 1, h + 1)); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); setHover(h => Math.max(0, h - 1)); }
      if (e.key === 'Enter' || e.key === 'Tab') {
        if (filtered[hover]?.available) { e.preventDefault(); onPick(filtered[hover]); }
      }
    };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [filtered, hover, onPick, onClose]);

  if (filtered.length === 0) {
    return (
      <div style={slashMenuStyle}>
        <div style={{ padding: 14, fontSize: 12, color: 'var(--ink-3)', textAlign: 'center' }}>
          No command matches "{query}"
        </div>
      </div>
    );
  }

  let idx = -1;
  return (
    <div style={slashMenuStyle}>
      <div style={{
        padding: '8px 12px 6px', fontSize: 10, color: 'var(--ink-3)',
        display: 'flex', alignItems: 'center', gap: 8,
        borderBottom: '1px solid var(--line-2)',
      }} className="mono">
        <span style={{ textTransform: 'uppercase', letterSpacing: '0.08em' }}>Commands</span>
        <div style={{ flex: 1 }}/>
        <span>↑↓ navigate · ⏎ pick · esc close</span>
      </div>

      <div style={{ maxHeight: 280, overflowY: 'auto', padding: 4 }}>
        {Object.entries(groups).map(([g, items]) => (
          <div key={g}>
            <div className="mono" style={{ padding: '6px 10px 2px', fontSize: 9.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.07em' }}>{g}</div>
            {items.map(c => {
              idx++;
              const active = idx === hover;
              return (
                <button
                  key={c.cmd}
                  onMouseEnter={((i) => () => setHover(i))(idx)}
                  disabled={!c.available}
                  onClick={() => { if (c.available) onPick(c); }}
                  style={{
                    width: '100%', textAlign: 'left',
                    display: 'flex', alignItems: 'center', gap: 10,
                    padding: '7px 10px', borderRadius: 6,
                    background: active ? 'var(--accent-soft)' : 'transparent',
                    opacity: c.available ? 1 : 0.52,

<script type="text/babel" src="src/Chat.jsx" data-presets="react">
﻿// AI chat column. Three states: empty / generating / returned.

// 生成耗时计时器，每秒刷新
const ChatTimer = ({ startedAt }) => {
  const [elapsed, setElapsed] = React.useState(Math.floor((Date.now() - startedAt) / 1000));
  React.useEffect(() => {
    const id = setInterval(() => setElapsed(Math.floor((Date.now() - startedAt) / 1000)), 1000);
    return () => clearInterval(id);
  }, [startedAt]);
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  return React.createElement('span', {
    className: 'mono',
    style: { fontSize: 11, color: 'var(--ink-3)', fontVariantNumeric: 'tabular-nums' },
  }, m > 0 ? m + 'm ' + String(s).padStart(2, '0') + 's' : s + 's');
};

const Avatar = ({ who, user }) => {
  const [imgFailed, setImgFailed] = React.useState(false);

  const avatarUrl = username ? (window.API_BASE || window.location.origin) + '/avatars/' + encodeURIComponent(username) + '.png' : '';

  if (who === 'ai') {
    return (
      <div style={{
        width: 24, height: 24, borderRadius: 7, flexShrink: 0,

        username ? username[0] : '我'

};

const Bubble = ({ who, children, meta, user }) => (

);

// 简易 Markdown → HTML 渲染（支持粗体、斜体、行内代码、列表、标题、链接）
const renderMarkdown = (text) => {
  if (!text) return '';
  let html = text;
  // 行内代码（优先，避免被后续规则干扰）
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:11.5px;font-family:monospace;">$1</code>');
  // 粗体
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // 斜体
  html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
  // 链接
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent);">$1</a>');
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:13px;font-weight:600;margin:4px 0 2px;">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2 style="font-size:14px;font-weight:600;margin:6px 0 2px;">$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1 style="font-size:15px;font-weight:600;margin:6px 0 2px;">$1</h1>');
  // 无序列表
  html = html.replace(/^- (.+)$/gm, '<li style="margin-left:16px;">$1</li>');
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin-left:16px;">$1</li>');
  // 换行
  html = html.replace(/\n/g, '<br/>');
  return html;
};

const TextBubble = ({ who, children, markdown }) => {
  const content = markdown && who === 'ai' ? renderMarkdown(children) : children;
  return (
    <div style={{

      padding: '9px 12px', borderRadius: 10,
      background: who === 'user' ? 'var(--ink)' : 'var(--panel)',

        <div dangerouslySetInnerHTML={{ __html: content }}/>

};

const OptionChips = ({ title, options, multi }) => {

const actionBtnPrimaryStyle = {

const AnalyzedSubject = () => (

// ---------- BriefCard（Agent 模式 CONFIRM 阶段的创意方案卡片）----------

const BriefCard = ({ brief, completeness }) => {
  if (!brief) return null;
  const rows = [];
  if (brief.concept) rows.push(['核心方案', brief.concept]);
  if (Array.isArray(brief.visualElements) && brief.visualElements.length > 0) {
    rows.push(['视觉要素', brief.visualElements.join(' · ')]);
  }
  if (brief.copyText) rows.push(['画面文案', brief.copyText]);
  if (brief.aspectRatio) rows.push(['画幅比例', brief.aspectRatio]);
  if (brief.style) rows.push(['风格', brief.style]);
  if (brief.mood) rows.push(['氛围', brief.mood]);
  if (brief.colorDirection) rows.push(['色彩方向', brief.colorDirection]);

  const score = completeness && typeof completeness.score === 'number' ? completeness.score : null;
  const isConfirmed = brief.confirmedByUser;

  return (
    <div style={{
      borderRadius: 10, padding: 12, width: '100%',
      background: isConfirmed ? 'var(--accent-soft)' : 'var(--panel)',
      border: '1px solid ' + (isConfirmed ? 'var(--accent)' : 'var(--line-2)'),
      transition: 'background 200ms, border-color 200ms',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <I.sparkles size={12} style={{ color: 'var(--accent)' }}/>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: 'var(--ink)' }}>
            创意方案 Brief
          </span>
          {isConfirmed && (
            <span style={{
              fontSize: 10, padding: '1px 6px', borderRadius: 99,
              background: 'var(--accent)', color: '#fff', fontWeight: 500,
            }}>已确认</span>
          )}
        </div>
        {score !== null && (
          <span className="mono" style={{
            fontSize: 10, color: 'var(--ink-3)',
            padding: '2px 6px', borderRadius: 4, background: 'var(--panel-2)',
          }}>
            完整度 {score}/100
          </span>
        )}
      </div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'auto 1fr',
        gap: '6px 12px', fontSize: 11.5,
      }}>
        {rows.map(([k, v]) => (
          <React.Fragment key={k}>
            <span className="mono" style={{
              color: 'var(--ink-3)', fontSize: 10,
              textTransform: 'uppercase', letterSpacing: '0.05em',
              alignSelf: 'flex-start', paddingTop: 2, whiteSpace: 'nowrap',
            }}>{k}</span>
            <span style={{ color: 'var(--ink)', lineHeight: 1.5 }}>{v}</span>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
};

const normalizeReferenceUrl = function(rawUrl) {
  const value = String(rawUrl || '').trim();
  if (!value) return '';
  try {
    const parsed = new URL(value, window.location.origin);
    const localHosts = ['localhost', '127.0.0.1', '[::1]', '::1'];
    const parsedHost = String(parsed.hostname || '').toLowerCase();
    if (localHosts.includes(parsedHost)) {
      parsed.protocol = window.location.protocol;
      parsed.host = window.location.host;
      return parsed.toString();
    }
    return parsed.toString();
  } catch (e) {
    return value;
  }
};

            prev.forEach(function(entry) {

            return [];

        var immediateEntries = canvasReferenceSelection.images.slice(0, MAX_REFERENCE_IMAGES).map(function(item, idx) {

            const safeName = item.name && /\.[a-z0-9]+$/i.test(item.name) ? item.name : ((item.name || 'reference') + '.' + ext);
            const file = new File([blob], safeName, { type: blob.type || 'image/png' });
            return Object.assign({}, item, { file: file, pending: false });
          })
        );
        if (!alive) {
          return;
        }
        setCanvasRefImages(function(prev) {
          return prev.map(function(entry) {
            if (!entry || !entry.sourceUrl) return entry;
            const match = loaded.find(function(result) {
              return result && result.status === 'fulfilled' && result.value && result.value.sourceUrl === entry.sourceUrl;
            });
            if (match && match.status === 'fulfilled') return match.value;
            return Object.assign({}, entry, { pending: false });
          });
        });

const AGENT_MODE_KEY = 'designflow_agent_mode_enabled';
const AGENT_PROJECT_ID_KEY = 'designflow_agent_project_id';
const mapAgentProjectMessages = function(project, images) {
  const base = Array.isArray(project && project.messages) ? project.messages.map(function(item) {
    var payload = item && item.payload ? item.payload : {};
    var refMeta = Array.isArray(payload.reference_images) ? payload.reference_images : [];
    var decision = (payload && payload.decision) || {};
    var msg = {
      who: item && item.role === 'user' ? 'user' : 'ai',
      text: (item && item.text) || '',
      meta: item && item.role === 'assistant' ? 'Agent' : undefined,
      refMeta: refMeta,
    };
    // 恢复 CONFIRM 的 Brief 卡片 + 快捷按钮
    if (decision && decision.type === 'CONFIRM') {
      if (decision.brief) msg.brief = decision.brief;
      if (decision.completeness) msg.completeness = decision.completeness;
      if (Array.isArray(decision.quickActions) && decision.quickActions.length > 0) {
        msg.quickActions = decision.quickActions;
      }
      msg.decisionType = 'CONFIRM';
    } else if (decision && decision.type === 'ASK') {
      if (Array.isArray(decision.choices) && decision.choices.length > 0) {
        msg.choices = decision.choices;
      }
      msg.decisionType = 'ASK';
    }
    return msg;
  }) : [];
  const items = Array.isArray(images) ? images : [];
  if (!items.length) return base;
  return base.concat(items.map(function(image) {
    return {
      who: 'ai',
      type: 'ai-image-generating',
      model: (image && image.model) || 'agent',
      prompt: image && image.prompt ? (image.prompt.positive || '') : '',
      promptPayload: image && image.prompt ? image.prompt : null,
      status: 'done',
      imageUrl: image && image.image_url ? ((window.API_BASE || window.location.origin) + image.image_url) : '',
      finalElapsed: null,
      progress: 100,
      meta: 'Agent',
    };
  }));
};

const Chat = ({ state, template, onComposeComplete, slashTrigger, user, onRequestSpecialTemplate, seedPrompt, onSeedConsumed, canvasReferenceSelection }) => {
  const [messages, setMessages] = React.useState([]);
  const [defaultMessages, setDefaultMessages] = React.useState([]);
  const [agentMessages, setAgentMessages] = React.useState([]);
  const [isLoading, setIsLoading] = React.useState(false);
  const [lastSubmittedMessage, setLastSubmittedMessage] = React.useState('');
  const [currentAiChatId, setCurrentAiChatId] = React.useState('');
  const [composerResetKey, setComposerResetKey] = React.useState(0);
  const [greetingResetKey, setGreetingResetKey] = React.useState(0);
  const [agentEnabled, setAgentEnabled] = React.useState(false);
  const [agentProjectId, setAgentProjectId] = React.useState('');
  const [agentProject, setAgentProject] = React.useState(null);
  const [historyOpen, setHistoryOpen] = React.useState(false);
  const [historyLoading, setHistoryLoading] = React.useState(false);
  const [historySessions, setHistorySessions] = React.useState([]);
  const [hoveredHistoryId, setHoveredHistoryId] = React.useState('');
  const historyWrapRef = React.useRef(null);
  const creatingAgentProjectRef = React.useRef(null);

  // Extract required fields from template slots (e.g., "slot/product_1/name" -> "name")
  const getTemplateFields = React.useCallback((t) => {
    if (!t || !t.slots || t.slots.length === 0) return ['name'];
    const fields = new Set();
    t.slots.forEach(s => {
      const parts = (s.name || '').split('/');
      if (parts.length >= 3) {
        fields.add(parts[2]); // e.g., "name" from "slot/product_1/name"
      }
    });
    const result = Array.from(fields);
    return result.length > 0 ? result : ['name'];
  }, []);

  const templateFields = getTemplateFields(template);

  const loadAgentProject = React.useCallback(async function(projectId) {
    if (!projectId) return null;
    const data = await window.API.getAgentProject(projectId);
    const imgs = await window.API.listAgentProjectImages(projectId);
    const mapped = mapAgentProjectMessages(data, imgs);
    setAgentProject(data);
    setAgentProjectId(projectId);
    setAgentMessages(mapped);
    if (agentEnabled) setMessages(mapped);
    if (onComposeComplete && data) {
      onComposeComplete(null, null, data.currentImageUrl ? [data.currentImageUrl] : [], null);
    }
    return data;
  }, [agentEnabled, onComposeComplete]);

  const ensureAgentProject = React.useCallback(async function() {
    // 如果有保存的 ID，先尝试加载；加载失败则重新创建
    if (agentProjectId) {
      try {
        const data = await window.API.getAgentProject(agentProjectId);
        if (data && data.id) return agentProjectId;
      } catch (e) {
        // 项目已不存在（404），清除旧 ID，继续创建新项目
        setAgentProjectId('');
        try { localStorage.removeItem(AGENT_PROJECT_ID_KEY); } catch (ex) {}
      }
    }
    if (creatingAgentProjectRef.current) return creatingAgentProjectRef.current;
    creatingAgentProjectRef.current = window.API.createAgentProject()
      .then(function(created) {
        setAgentProject(created);
        setAgentProjectId(created.id);
        return created.id;
      })
      .finally(function() {
        creatingAgentProjectRef.current = null;
      });
    return creatingAgentProjectRef.current;
  }, [agentProjectId]);

  React.useEffect(() => {
    if (!user) return;
    let cancelled = false;
    (async function() {
      if (!agentEnabled) {
        setMessages(defaultMessages);
        return;
      }
      try {
        const projectId = await ensureAgentProject();
        if (cancelled) return;
        const data = await window.API.getAgentProject(projectId);
        const imgs = await window.API.listAgentProjectImages(projectId);
        if (cancelled) return;
        const mapped = mapAgentProjectMessages(data, imgs);
        setAgentProject(data);
        setAgentProjectId(projectId);
        setAgentMessages(mapped);
        setMessages(mapped);
      } catch (e) {
        if (!cancelled) {
          setAgentMessages([{ who: 'ai', text: 'Agent 初始化失败：' + ((e && e.message) || '未知错误'), meta: 'Agent' }]);
          setMessages([{ who: 'ai', text: 'Agent 初始化失败：' + ((e && e.message) || '未知错误'), meta: 'Agent' }]);
        }
      }
    })();
    return function() { cancelled = true; };
  }, [agentEnabled, ensureAgentProject, user]);

  React.useEffect(() => {
    if (agentEnabled) setAgentMessages(messages);
    else setDefaultMessages(messages);
  }, [agentEnabled, messages]);

  const loadAiChatHistory = React.useCallback(async () => {
    setHistoryLoading(true);
    try {
      const sessions = await window.API.listAiChats(20);
      setHistorySessions(sessions || []);
    } catch (e) {
      console.error('load ai chat history failed:', e);
      setHistorySessions([]);
    } finally {
      setHistoryLoading(false);
    }
  }, []);

  const loadAgentProjectHistory = React.useCallback(async () => {
    setHistoryLoading(true);
    try {
      const res = await window.API.listAgentProjects(1, 20);
      setHistorySessions((res && res.data) || []);
    } catch (e) {
      console.error('load agent project history failed:', e);
      setHistorySessions([]);
    } finally {
      setHistoryLoading(false);
    }
  }, []);

  const openHistory = React.useCallback(() => {
    setHistoryOpen(function(prev) {
      const next = !prev;
      if (!prev) {
        if (agentEnabled) loadAgentProjectHistory();
        else loadAiChatHistory();
      }
      return next;
    });
  }, [agentEnabled, loadAgentProjectHistory, loadAiChatHistory]);

  const restoreAiChatSession = React.useCallback(async (sessionId) => {
    try {
      const data = await window.API.getAiChat(sessionId);
      setMessages(Array.isArray(data.messages) ? data.messages : []);
      setCurrentAiChatId(sessionId);
      setHistoryOpen(false);
      const lastUser = (data.messages || []).filter(function(m) { return m && m.who === 'user' && m.text; }).slice(-1)[0];
      setLastSubmittedMessage(lastUser ? lastUser.text : '');
    } catch (e) {
      console.error('restore ai chat session failed:', e);
    }
  }, []);

  const restoreAgentProjectSession = React.useCallback(async (projectId) => {
    try {
      await loadAgentProject(projectId);
      setHistoryOpen(false);
    } catch (e) {
      console.error('restore agent project failed:', e);
      window.alert((e && e.message) ? e.message : '恢复 Agent 对话失败');
    }
  }, [loadAgentProject]);

  const deleteAiChatHistory = React.useCallback(async (sessionId) => {
    if (!sessionId) return;
    if (!window.confirm('删除这条历史对话？')) return;
    try {
      await window.API.deleteAiChat(sessionId);
      setHistorySessions(function(prev) {
        return prev.filter(function(session) { return session.id !== sessionId; });
      });
      if (currentAiChatId === sessionId) {
        setMessages([]);
        setCurrentAiChatId('');
        setComposerResetKey(function(prev) { return prev + 1; });
      }
    } catch (e) {
      console.error('delete ai chat history failed:', e);
      window.alert((e && e.message) ? e.message : '删除失败，请稍后重试');
    }
  }, [currentAiChatId]);

  const deleteAgentProjectHistory = React.useCallback(async (projectId) => {
    if (!projectId) return;
    if (!window.confirm('删除这条 Agent 对话？')) return;
    try {
      await window.API.deleteAgentProject(projectId);
      setHistorySessions(function(prev) {
        return prev.filter(function(project) { return project.id !== projectId; });
      });
      if (agentProjectId === projectId) {
        setAgentProjectId('');
        setAgentProject(null);
        setAgentMessages([]);
        setMessages([]);
        setComposerResetKey(function(prev) { return prev + 1; });
        if (onComposeComplete) onComposeComplete(null, null, [], null);
      }
    } catch (e) {
      console.error('delete agent project failed:', e);
      window.alert((e && e.message) ? e.message : '删除失败，请稍后重试');
    }
  }, [agentProjectId, onComposeComplete]);

  const startNewAiChat = React.useCallback(() => {
    if (isLoading) return;
    if (agentEnabled) {
      (async function() {
        setIsLoading(true);
        try {
          creatingAgentProjectRef.current = null;
          setAgentProject(null);
          setAgentProjectId('');
          try { localStorage.removeItem(AGENT_PROJECT_ID_KEY); } catch (ex) {}
          const created = await window.API.createAgentProject();
          setAgentProject(created);
          setAgentProjectId(created.id);
          setAgentMessages([]);
          setMessages([]);
          setHistoryOpen(false);
          setComposerResetKey(function(prev) { return prev + 1; });
          setGreetingResetKey(function(prev) { return prev + 1; });
          if (onComposeComplete) onComposeComplete(null, null, [], null);
        } catch (e) {
          setMessages([{ who: 'ai', text: '新建 Agent 对话失败：' + ((e && e.message) || '未知错误'), meta: 'Agent' }]);
        } finally {
          setIsLoading(false);
        }
      })();
      return;
    }
    setMessages([]);
    setDefaultMessages([]);

  const parseProductRefs = React.useCallback(function(message) {
    var refs = [];
    var text = String(message || '');
    var pattern = /\[([^\[\]]+)\]/g;
    var match;
    while ((match = pattern.exec(text)) !== null) {
      var rawInner = (match[1] || '').trim();
      if (!rawInner) continue;
      var normalized = rawInner.replace(/\s+/g, '');
      var isAngle = /一双鞋角度$/i.test(normalized);
      var sku = isAngle ? normalized.replace(/一双鞋角度$/i, '') : normalized;
      if (!sku) continue;
      refs.push({
        raw: match[0],
        sku: sku,
        asset_type: isAngle ? 'white2x' : 'white',
      });
    }
    return refs;
  }, []);

  const loadResolvedRefFiles = React.useCallback(async function(resolvedRefs) {
    var files = [];
    for (var i = 0; i < resolvedRefs.length; i++) {
      var ref = resolvedRefs[i];
      if (!ref || !ref.matched) continue;
      var blob = null;
      if (ref.content_base64) {
        var binary = atob(ref.content_base64);
        var bytes = new Uint8Array(binary.length);
        for (var j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
        blob = new Blob([bytes], { type: ref.mime_type || 'image/png' });
      } else if (ref.url) {
        var apiBase = window.API_BASE || window.location.origin;
        var resp = await fetch(apiBase + ref.url, { credentials: 'include' });
        if (!resp.ok) throw new Error('素材图下载失败: ' + (ref.sku || 'unknown'));
        blob = await resp.blob();
      }
      if (!blob) throw new Error('素材图下载失败: ' + (ref.sku || 'unknown'));
      files.push({
        file: new File([blob], ref.filename || ((ref.sku || 'product') + '.png'), { type: blob.type || ref.mime_type || 'image/png' }),
        previewUrl: URL.createObjectURL(blob),

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxSize = 200;
      let w = img.width, h = img.height;
      if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
      else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Failed to load image')); };
    img.src = url;

              });

            setIsLoading(false);
          },
          onClose: function() {
            setIsLoading(false);
          },
        }, refImages);
      } catch (e) {
        setMessages(function(msgs) {
          return msgs.map(function(m, i) {
            if (i !== assistantIdx) return m;
            return { who: 'ai', text: 'Agent 执行失败：' + ((e && e.message) || '未知错误'), meta: 'Agent' };
          });
        });
        setIsLoading(false);
      }
      return;
    }

    // ── 设为头像 ──────────────────────────────────────────────────────────────
    const trimmed = text.trimStart();
    if ((trimmed === '设为头像' || trimmed === '設置頭像') && refImages.length > 0) {
      setMessages(msgs => [...msgs, { who: 'user', text, refPreviews: userRefPreviews, refMeta: userRefMeta }]);
      setIsLoading(true);
      try {
        const apiBase = window.API_BASE || window.location.origin;
        const fd = new FormData();
        fd.append('image', refImages[0].file);
        const res = await fetch(apiBase + '/auth/avatar', { method: 'POST', body: fd, credentials: 'include' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || '设置头像失败');
        }
        const data = await res.json();
        setMessages(msgs => [...msgs, { who: 'ai', text: '头像设置成功！刷新页面后生效。' }]);
      } catch (e) {
        setMessages(msgs => [...msgs, { who: 'ai', text: '设置头像失败: ' + (e.message || '未知错误') }]);
      }
      setIsLoading(false);
      return;
    }

    // ── 花瓣下载 ─────────────────────────────────────────────────────────────
    // UI 锁定 /花瓣下载, 或用户显式打字 (向后兼容)
    if (trimmed.startsWith('/花瓣下载')) {
      const args = trimmed.replace(/^\/花瓣下载\s*/, '').trim();
      const match = args.match(/^(\S+)(?:\s+([A-Za-z0-9._-]+))?$/);
      setMessages(msgs => [...msgs, { who: 'user', text: args || text, refPreviews: userRefPreviews, refMeta: userRefMeta }]);
      if (!match) {
        setMessages(msgs => [...msgs, { who: 'ai', text: '请使用格式：/花瓣下载 URL 或 /花瓣下载 URL PSD', meta: 'Loom' }]);
        return;
      }
      const normalizeHuabanSource = function(value) {
        const raw = (value || '').trim();
        if (!raw) return raw;
        if (/^https?:\/\//i.test(raw)) return raw;
        if (/^\d+$/.test(raw)) return 'https://huaban.com/pins/' + raw;
        return 'https://huaban.com/pins/' + raw.replace(/^\/+|\/+$/g, '');
      };
      const sourceUrl = normalizeHuabanSource(match[1]);
      const selectedFormat = match[2] || '';
      const fmtBytes = function(bytes) {
        var n = Number(bytes || 0);
        if (!n) return '';
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1).replace(/\\.0$/, '') + ' KB';
        return (n / (1024 * 1024)).toFixed(1).replace(/\\.0$/, '') + ' MB';
      };
      const runProxyDownload = async function(url, format, replaceIndex) {
        setIsLoading(true);
        const isFirstCall = replaceIndex == null;
        let pendingIdx = replaceIndex;
        if (isFirstCall) {
          setMessages(msgs => {
            pendingIdx = msgs.length;
            return [...msgs, { who: 'ai', type: 'thinking', text: '正在打开花瓣页面…', meta: '花瓣下载' }];
          });
        } else {
          setMessages(msgs => msgs.map((m, idx) => idx === pendingIdx ? { who: 'ai', type: 'thinking', text: '正在下载文件…', meta: '花瓣下载' } : m));
        }
        // 轮换提示文字，让用户感知进度
        const stages = isFirstCall
          ? [{ after: 6000, text: '正在查找下载按钮…' }, { after: 15000, text: '页面加载较慢，请耐心等待…' }]
          : [{ after: 8000, text: '文件较大，仍在下载中…' }, { after: 20000, text: '网络较慢，请耐心等待…' }];
        let stageIdx = 0;
        let progressTimer = null;
        const scheduleNext = () => {
          if (stageIdx >= stages.length) return;
          const delay = stages[stageIdx].after - (Date.now() - startedAt);
          progressTimer = setTimeout(() => {
            const s = stages[stageIdx];
            if (s && typeof pendingIdx === 'number') {
              setMessages(msgs => msgs.map((m, idx) => idx === pendingIdx
                ? Object.assign({}, m, { text: s.text })
                : m));
            }
            stageIdx++;
            scheduleNext();
          }, Math.max(delay, 500));
        };
        const startedAt = Date.now();
        scheduleNext();
        try {
          const res = await window.API.proxyDownload(url, format || null);
          clearTimeout(progressTimer);
          if (res.status === 'choose_format') {
            setMessages(msgs => msgs.map((m, idx) => idx === pendingIdx ? {
              who: 'ai',
              type: 'proxy-download-choice',
              meta: '花瓣下载',
              text: res.message || '请选择下载格式',
              formats: res.formats || [],
              onChoose: function(fmt) { runProxyDownload(url, fmt, pendingIdx); },
            } : m));
          } else {
            setMessages(msgs => msgs.map((m, idx) => idx === pendingIdx ? {
              who: 'ai',
              type: 'proxy-download-result',
              meta: '花瓣下载',
              filename: res.filename,
              format: res.format,
              sizeText: fmtBytes(res.size),
              downloadUrl: (window.API_BASE || window.location.origin) + res.download_url,
            } : m));
          }
        } catch (e) {
          clearTimeout(progressTimer);
          setMessages(msgs => msgs.map((m, idx) => idx === pendingIdx ? {
            who: 'ai',
            text: '下载失败: ' + (e.message || '未知错误'),
            meta: '花瓣下载',
          } : m));
        }
        setIsLoading(false);
      };
      await runProxyDownload(sourceUrl, selectedFormat, null);
      return;
    }

    // ── AI 生图指令匹配 ────────────────────────────────────────────────────────
    // 用户心智: 只通过 UI 选模型 (lockedCommand), 不再手动打 / 指令.
    // aiCmd 直接从 lockedCommand 解析, 永远 implicit.
    const AI_IMAGE_CMDS = [
      { prefix: '/Nano Banana pro', model: 'nano-banana-pro' },
      { prefix: '/Gpt image 2',     model: 'gpt-image-2' },
    ];
    const FRESH_KEYWORDS = ['重新生成', '重新生图', '全新生成'];
    const aiCmd = AI_IMAGE_CMDS.find(c => text.trimStart().toLowerCase().startsWith(c.prefix.toLowerCase()))
      ? Object.assign({}, AI_IMAGE_CMDS.find(c => text.trimStart().toLowerCase().startsWith(c.prefix.toLowerCase())), { implicit: true })
      : null;

    // 检测"重新生成"关键词
    const rawPrompt = text.trim();
    const freshMatch = FRESH_KEYWORDS.find(kw => rawPrompt.startsWith(kw));
    if (freshMatch) {
      const rest = rawPrompt.slice(freshMatch.length).trim();
      const freshPrompt = rest || '重新生成';
      const lastOpts = getLastAiImageOptions();
      const model = aiCmd ? aiCmd.model : (lastOpts?.model || 'gpt-image-2');
      const opts = aiCmd ? aiOptions : { ...aiOptions, size: lastOpts?.size || aiOptions.size, resolution: lastOpts?.resolution || aiOptions.resolution, provider: aiOptions.provider };
      setMessages(msgs => [...msgs, { who: 'user', text: aiCmd && !aiCmd.implicit ? rawPrompt : text, refPreviews: userRefPreviews, refMeta: userRefMeta }]);
      return;
    }

    if (aiCmd) {
      const plainText = text.trim().slice(aiCmd.prefix.length).trimStart();
      if (!plainText) {
        const prefixLabel = aiCmd.implicit ? '（复用上次模型）' : aiCmd.prefix;
        setMessages(msgs => [...msgs,
          { who: 'user', text, refPreviews: userRefPreviews, refMeta: userRefMeta },
          { who: 'ai', text: `请在 ${prefixLabel} 后输入图片描述` },
        ]);
        return;
      }
      setMessages(msgs => [...msgs, { who: 'user', text: plainText, refPreviews: userRefPreviews, refMeta: userRefMeta }]);
      await runAiImageGeneration(aiCmd.model, plainText, plainText, refImages, aiOptions);
      return;
    }

    // ── 特殊品（完整）流程 ────────────────────────────────────────────────────
    const _isSpecialFull = text.trimStart().startsWith('/特殊品（完整）');
    const _isSpecial     = !_isSpecialFull && text.trimStart().startsWith('/特殊品');
    if (_isSpecial || _isSpecialFull) {
      const _cmdLabel  = _isSpecialFull ? '特殊品（完整）' : '特殊品';
      const _endpoint  = _isSpecialFull ? '/special-compose-full' : '/special-compose';
      const _pollBase  = _isSpecialFull ? '/special-compose-full' : '/special-compose';
      const _argRegex  = _isSpecialFull ? /^\/特殊品（完整）\s*/ : /^\/特殊品\s*/;
      const _errHint   = _isSpecialFull
        ? '请提供 SKU，格式：/特殊品（完整） SKU，文案，时间文案'
        : '请提供 SKU，格式：/特殊品 SKU，文案，时间文案';
      const _tplHint   = _isSpecialFull ? '请先在左侧选择特殊品（完整）模板' : '请先在左侧选择特殊品模板';

      const displayText = text.replace(_argRegex, '').trim() || text;
      setMessages(msgs => [...msgs, { who: 'user', text: displayText, refPreviews: userRefPreviews, refMeta: userRefMeta }]);
      setIsLoading(true);
      // 先插入 generating 消息占位
      let specialMsgIdx = null;
      setMessages(msgs => {
        specialMsgIdx = msgs.length;
        return [...msgs, {
          who: 'ai', type: 'generating',
          logs: [`正在启动${_cmdLabel}合成…`],
          status: 'running', meta: `Loom · ${_cmdLabel}`,
          startedAt: Date.now(),
        }];
      });
      try {
        const args = text.replace(_argRegex, '').trim();
        const parts = args.split('，').map(s => s.trim());
        const sku = parts[0] || '';
        const fields = { name: parts[1] || '', time: parts[2] || '' };
        if (!sku) throw new Error(_errHint);
        if (!template) throw new Error(_tplHint);

        const frameIds = template.frames ? template.frames.map(f => f.id) : [template.id];
        const fileId = template.file_id || (template.frames && template.frames[0]?.file_id);
        const pageId = template.page_id || (template.frames && template.frames[0]?.page_id);

        const resp = await fetch(_endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_id: fileId, page_id: pageId, frame_ids: frameIds, sku, fields, export_scale: 2.0 }),
        });
        if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.detail || resp.status); }
        const job = await resp.json();

        // 轮询 + 实时更新日志
        let done = false;
        for (let i = 0; i < 120 && !done; i++) {
          await new Promise(r => setTimeout(r, 1500));
          const s = await fetch(`${_pollBase}/${job.id}`).then(r => r.json());
          setMessages(msgs => msgs.map((m, idx) => {
            if (idx !== specialMsgIdx) return m;
            const finishing = s.status === 'done' || s.status === 'failed';
            return { ...m, logs: s.progress || [], status: s.status,
              ...(finishing && m.startedAt ? { finalElapsed: Math.floor((Date.now() - m.startedAt) / 1000) } : {}),
            };
          }));
          if (s.status === 'done') {
            // 优先用后端记录的 result_paths（支持变体 _v1/_v2 命名），降级到旧模式
            const buildUrls = () => {
              if (s.result_paths && s.result_paths.length > 0) {
                // result_paths 是绝对路径，提取 {job_id}/frame_xxx.png 部分
                return s.result_paths.map(p => {
                  const m = p.replace(/\\/g, '/').match(/results\/(.+)$/);
                  return m ? `/results/${m[1]}` : null;
                }).filter(Boolean);
              }
              // 降级：旧命名 frame_{i}.png
              const frameIds = s.result_frame_ids || [];
              return frameIds.map((_, i) => `/results/${job['id']}/frame_${i}.png`);
            };
            const urls = buildUrls();
            const frameNames = (template.frames && template.frames.length > 0 ? template.frames : [template]).map(f => f.name || f.variant || '画板');
            const zipUrl = `${_pollBase}/${job['id']}/download-zip?names=${encodeURIComponent(frameNames.join(','))}`;
            setMessages(msgs => msgs.map((m, idx) => {
              if (idx !== specialMsgIdx) return m;
              return { ...m, status: 'done', specialUrls: urls, penpotUrl: s.penpot_edit_url, zipUrl };
            }));
            // 构建 resultTpl 供画布预览
            if (onComposeComplete && urls.length > 0 && template) {
              const base = structuredClone(template);
              const baseFrames = base.frames && base.frames.length > 0 ? base.frames : [base];
              base.frames = urls.map((url, i) => ({ ...(baseFrames[i % baseFrames.length] || baseFrames[0]), resultUrl: url }));
              base._frameNames = frameNames;
              window.lastComposeJobId = job['id'];
              window.lastComposeEndpoint = _pollBase;
              window.lastComposeFrameNames = frameNames;
              onComposeComplete(null, s.penpot_edit_url, urls, base);
            }
            done = true;
          } else if (s.status === 'failed') {
            throw new Error(s.error || '合成失败');
          }
        }
        if (!done) throw new Error('合成超时，请检查后端日志');
      } catch (e) {
        setMessages(msgs => msgs.map((m, idx) => {
          if (idx !== specialMsgIdx) return m;
          return { ...m, status: 'failed', error: e.message };
        }));
      }
      setIsLoading(false);
      return;
    }

    // ── 普通消息 ─────────────────────────────────────────────────────────────
    setIsLoading(true);
    let thinkingIdx = null;
    setMessages(msgs => {
      thinkingIdx = msgs.length + 1; // +1 跳过用户消息，定位到 thinking 占位
      return [...msgs,
        { who: 'user', text, refPreviews: userRefPreviews, refMeta: userRefMeta },
        { who: 'ai', type: 'thinking', text: '...' },
      ];
    });
    try {
      const reply = await window.API.chatWithAI(
        [{ role: 'user', content: text }],
        {}
      );
      setMessages(msgs => msgs.map((m, i) =>
        i === thinkingIdx ? { who: 'ai', text: reply || '...', meta: 'Loom' } : m
      ));
    } catch (e) {
      setMessages(msgs => msgs.map((m, i) =>
        i === thinkingIdx ? { who: 'ai', text: '错误: ' + (e.message || '未知错误'), meta: '错误' } : m
      ));
    }
    setIsLoading(false);
  }, [agentEnabled, currentAiChatId, ensureAgentProject, enhancePromptWithProductRefs, getLastAiImageOptions, isLoading, loadAiChatHistory, loadResolvedRefFiles, materializeReferenceImages, onComposeComplete, parseProductRefs, runAiImageGeneration, template]);

  // ── 快捷回复：点击选项按钮触发 ──────────────────────────────────────────────
  const handleQuickReply = React.useCallback(function(value) {
    handleSend(value, [], {});
  }, [handleSend]);

  const handleParseTable = React.useCallback(async (file, filename, imageType) => {
    // Add user message showing file was uploaded
    setMessages(msgs => [...msgs, { who: 'user', text: '已上传 ' + filename, file: filename, imageType: imageType }]);
    setIsLoading(true);
    try {
      const result = await window.API.parseTable(file, templateFields, imageType);
      // Add AI message with parse result
      setMessages(msgs => [...msgs, {
        who: 'ai',
        type: 'parse-result',
        data: result,
        meta: '解析了 ' + result.products.length + ' 个产品',
        fields: templateFields
      }]);
    } catch (e) {
      setMessages(msgs => [...msgs, { who: 'ai', text: '解析错误: ' + (e.message || '未知错误'), meta: '错误' }]);
    }
    setIsLoading(false);
  }, [isLoading, templateFields]);

  const handleCompose = React.useCallback(async (template, parseResult) => {
    if (!template || !parseResult) return;
    // Build slots from products with image_path
    const slots = {};
    parseResult.products.forEach((p, i) => {
      if (p.image_path) {
        slots['product_' + (i + 1)] = {
          image_path: p.image_path,
          name: p.name || null,
          price: p.price || null,
          tag: p.tag || null,
          spec: p.spec || null,
        };
      }
    });
    if (Object.keys(slots).length === 0) return;
    setIsLoading(true);
    // Add generating message
    let msgId = null;
    setMessages(msgs => {
      msgId = msgs.length;
      return [...msgs, {
        who: 'ai',
        type: 'generating',
        jobId: null,
        logs: ['正在启动合成任务...'],
        meta: '生成中',
        startedAt: Date.now(),
      }];
    });
    try {
      const job = await window.API.createCompose({
        file_id: template.file_id,
        template_frame_id: template.id,
        page_id: template.page_id,
        slots: slots,
        export_scale: 2.0,
      });
      // Poll for status
      const pollInterval = setInterval(async () => {
        try {
          const status = await window.API.getCompose(job.id);
          // Update logs
          setMessages(msgs => msgs.map((m, i) => {
            if (i !== msgId) return m;
            const finishing = status.status === 'done' || status.status === 'failed';
            return {
              ...m,
              jobId: job.id,
              status: status.status,
              logs: status.progress || [],
              resultPath: status.result_path,
              error: status.error,
              ...(finishing && m.startedAt ? { finalElapsed: Math.floor((Date.now() - m.startedAt) / 1000) } : {}),
            };
          }));
          // Stop polling if done or failed
          if (status.status === 'done' || status.status === 'failed') {
            clearInterval(pollInterval);
            setIsLoading(false);
            if (status.status === 'done' && onComposeComplete) {
              onComposeComplete(job.id, status.penpot_edit_url);
            }
          }
        } catch (e) {
          clearInterval(pollInterval);
          setIsLoading(false);
          setMessages(msgs => msgs.map((m, i) => {
            if (i !== msgId) return m;
            return { ...m, status: 'failed', error: e.message };
          }));
        }
      }, 1000);
    } catch (e) {
      setMessages(msgs => msgs.map((m, i) => {
        if (i !== msgId) return m;
        return { ...m, status: 'failed', error: e.message };
      }));
      setIsLoading(false);
    }
  }, [templateFields]);

  const toggleAgentMode = React.useCallback(function() {
    if (isLoading) return;
    setHistoryOpen(false);
    setAgentEnabled(function(prev) {
      if (prev) {
        setMessages(defaultMessages);
      }
      return !prev;

  const historyControl = (
    <div ref={historyWrapRef} style={{ position: 'relative', flexShrink: 0 }}>

        style={{

      {historyOpen && (

                      {metaLine}

            );
          })}

  return (

      {/* Header */}
      <div style={{

        display: 'flex', alignItems: 'center',

        borderBottom: '1px solid var(--line)',
      }}>

  if (!ts) return '-';
  var d = new Date(ts * 1000);
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };

    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function formatDuration(ts) {
  if (!ts) return '-';
  var diff = (Date.now() / 1000) - ts;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';

<script type="text/babel" src="src/InspirationPanel.jsx" data-presets="react">
// 灵感面板：覆盖在画布区域的浮层
// 布局：顶部栏（tab + 搜索 + 关闭） + 主体瀑布流（4 列） + 详情抽屉（点击图片展开）

const COLUMN_COUNT_DESKTOP = 4;
const COLUMN_GAP = 12;
const COLUMN_MIN_WIDTH = 200;

const InspirationPanel = ({ onClose, onUsePrompt }) => {
  const [tab, setTab] = React.useState('all'); // 'all' | 'mine'
  const [search, setSearch] = React.useState('');
  const [posts, setPosts] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [detailPost, setDetailPost] = React.useState(null);
  const [canvasRect, setCanvasRect] = React.useState(null);
  const [ratios, setRatios] = React.useState({}); // postId -> width/height
  const containerRef = React.useRef(null);
  const [containerWidth, setContainerWidth] = React.useState(0);
  const loadIdRef = React.useRef(0);

  // 跟踪画布位置，让浮层只覆盖画布区
  React.useEffect(function() {
    const iframe = document.querySelector('iframe[src*="editor-beta"]');
    if (!iframe) return;
    const update = function() {
      const r = iframe.getBoundingClientRect();
      setCanvasRect({ top: r.top, left: r.left, width: r.width, height: r.height });
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(iframe);
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, true);
    return function() {
      ro.disconnect();
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update, true);
    };
  }, []);

  // 跟踪主区域宽度
  React.useEffect(function() {
    if (!containerRef.current) return;
    const el = containerRef.current;
    const ro = new ResizeObserver(function(entries) {
      for (const e of entries) setContainerWidth(e.contentRect.width);
    });
    ro.observe(el);
    setContainerWidth(el.clientWidth);
    return function() { ro.disconnect(); };
  }, []);

  // 加载列表
  const loadPosts = React.useCallback(function() {
    const myLoadId = ++loadIdRef.current;
    setLoading(true);
    setError(null);
    window.API.listInspiration(50, 0, tab === 'mine')
      .then(function(rows) {
        if (myLoadId !== loadIdRef.current) return;
        setPosts(rows || []);
      })
      .catch(function(e) {
        if (myLoadId !== loadIdRef.current) return;
        setError(e.message || '加载失败');
        setPosts([]);
      })
      .finally(function() {
        if (myLoadId === loadIdRef.current) setLoading(false);
      });
  }, [tab]);

  React.useEffect(function() { loadPosts(); }, [loadPosts]);

  // 搜索过滤
  const setRatio = React.useCallback(function(postId, ratio) {

      if (prev[postId] === ratio) return prev;
      return Object.assign({}, prev, { [postId]: ratio });
    });
  }, []);

  const filtered = React.useMemo(function() {
    if (!search.trim()) return posts;
    const q = search.trim().toLowerCase();
    return posts.filter(function(p) {
      return (p.prompt || '').toLowerCase().includes(q);
    });
  }, [posts, search]);

  // 瀑布流分列（按图片宽高比，优先后端返回的尺寸）
  const waterFallCols = React.useMemo(function() {
    const colCount = containerWidth
      ? Math.max(1, Math.min(COLUMN_COUNT_DESKTOP,
          Math.floor((containerWidth + COLUMN_GAP) / (COLUMN_MIN_WIDTH + COLUMN_GAP))))
      : COLUMN_COUNT_DESKTOP;
    const colWidth = containerWidth
      ? Math.floor((containerWidth - COLUMN_GAP * (colCount - 1)) / colCount)
      : 0;
    const cols = Array.from({ length: colCount }, function() { return { items: [], height: 0 }; });
    filtered.forEach(function(post) {
      const ratio = (post.width && post.height) ? post.width / post.height : (ratios[post.id] || 1);
      const itemHeight = colWidth > 0 ? colWidth / ratio : colWidth;
      let minIdx = 0;
      for (let i = 1; i < colCount; i++) {
        if (cols[i].height < cols[minIdx].height) minIdx = i;
      }
      cols[minIdx].items.push({ post: post, height: itemHeight });
      cols[minIdx].height += itemHeight + COLUMN_GAP;
    });
    return { colCount: colCount, cols: cols };

  const closeDetail = React.useCallback(function() { setDetailPost(null); }, []);

      });

  const openDetail = React.useCallback(function(post) {

  }, []);

      zIndex: 50,
      background: 'var(--panel-2)',
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden',
    }}>
      {/* 顶部栏 */}
      <div style={{
        height: 44, flexShrink: 0,
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '0 16px',
        background: 'var(--panel)',
        borderBottom: '1px solid var(--line)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 500 }}>
          <I.sparkles size={13} style={{ color: 'var(--accent)' }}/>
          灵感
        </div>
        <div style={{ display: 'flex', gap: 2, marginLeft: 8 }}>
          {[
            { id: 'all', label: '全部' },
            { id: 'mine', label: '我发布的' },
          ].map(function(t) {
            const active = tab === t.id;
            return React.createElement('button', {
              key: t.id,
              onClick: function() { setTab(t.id); },
              style: {
                height: 28, padding: '0 12px',
                borderRadius: 6, border: 'none',
                background: active ? 'var(--panel-2)' : 'transparent',
                color: active ? 'var(--ink)' : 'var(--ink-2)',
                fontSize: 11.5, fontWeight: active ? 600 : 400,
                cursor: 'pointer',
              }
            }, t.label);
          })}
        </div>
        <div style={{ flex: 1 }}/>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 6,
          padding: '5px 10px', borderRadius: 6,
          background: 'var(--panel-2)', border: '1px solid var(--line-2)',
          width: 220,
        }}>
          <I.search size={12} style={{ color: 'var(--ink-3)' }}/>
          <input
            value={search}
            placeholder="搜索 prompt 关键词…"
            style={{
              flex: 1, border: 'none', outline: 'none',
              background: 'transparent', fontSize: 11.5, color: 'var(--ink)',
            }}
            onChange={function(e) { setSearch(e.target.value); }}
          />
        </div>
        <button
          onClick={function() { loadPosts(); }}
          title="刷新"
          style={{
            width: 28, height: 28, borderRadius: 6,
            background: 'var(--panel-2)', border: '1px solid var(--line-2)',
            color: 'var(--ink-2)', display: 'grid', placeItems: 'center', cursor: 'pointer',
          }}
        >
          <I.refresh size={12}/>
        </button>
        <button
          onClick={onClose}
          title="关闭灵感"
          style={{
            width: 28, height: 28, borderRadius: 6,
            background: 'var(--panel-2)', border: '1px solid var(--line-2)',
            color: 'var(--ink-2)', display: 'grid', placeItems: 'center', cursor: 'pointer',
          }}
        >
          <I.close size={12}/>
        </button>
      </div>

      {/* 主体 */}
      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: 16 }}>
        {error && (
          <div style={{ padding: 12, color: 'var(--warn)', fontSize: 12 }}>加载失败：{error}</div>
        )}
        {!error && loading && filtered.length === 0 && (
          <div style={{ padding: 24, color: 'var(--ink-3)', fontSize: 12, textAlign: 'center' }}>加载中…</div>
        )}
        {!error && !loading && filtered.length === 0 && (
          <div style={{ padding: 40, color: 'var(--ink-3)', fontSize: 12, textAlign: 'center' }}>
            {tab === 'mine' ? '你还没有发布过灵感' : '还没有灵感，去生张图试试吧'}
          </div>
        )}
        {filtered.length > 0 && (() => {
          // cols 已经在 useMemo 中算好
          return React.createElement('div', {
            style: {
              display: 'grid',
              gridTemplateColumns: 'repeat(' + waterFallCols.colCount + ', minmax(0, 1fr))',
              gap: COLUMN_GAP,
              alignItems: 'flex-start',
            }
          }, waterFallCols.cols.map(function(col, ci) {
            return React.createElement('div', {
              key: ci,
              style: { display: 'flex', flexDirection: 'column', gap: COLUMN_GAP, minWidth: 0 }
            }, col.items.map(function(item) {
              return React.createElement(InspirationCard, {
                key: item.post.id, post: item.post,
                height: item.height,
                onRatioLoad: setRatio,
                onOpen: function() { openDetail(item.post); },
              });
            }));
          }));
        })()}
      </div>

      {/* 详情抽屉 */}
      {detailPost && (
        <InspirationDetail
          post={detailPost}
          onClose={closeDetail}
          onUsePrompt={onUsePrompt}
          onUnpublish={detailPost.can_manage ? handleUnpublish : null}
        />
      )}
    </div>
  );
};

const InspirationCard = ({ post, height, onRatioLoad, onOpen }) => {
  return React.createElement('button', {
    onClick: onOpen,
    style: {

      border: '1px solid var(--line-2)',

// App root - wires panels + tweaks + host communication

const LAST_USERNAME_KEY = 'designflow_last_username';

const LiteLoginGate = ({ onLogin, loading, error, initialName }) => {
  const [name, setName] = React.useState(initialName || '');

  React.useEffect(() => {
    setName(initialName || '');
  }, [initialName]);

  const submit = async () => {
    const clean = name.trim();
    if (!clean || loading) return;
    await onLogin(clean);
  };

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 200,
      display: 'grid', placeItems: 'center',
      background: 'rgba(245, 245, 248, 0.78)',
      backdropFilter: 'blur(6px)',
    }}>
      <div style={{
        width: 'min(360px, calc(100vw - 32px))',
