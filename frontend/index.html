<style>
  :root {
    --bg: oklch(0.985 0.003 260);
    --panel: #ffffff;
    --panel-2: oklch(0.975 0.004 260);
    --surface-hover: oklch(0.962 0.005 260);
    --surface-active: oklch(0.945 0.006 260);
    --line: oklch(0.915 0.005 260);
    --line-2: oklch(0.948 0.005 260);
    --ink: oklch(0.18 0.01 260);
    --ink-2: oklch(0.38 0.01 260);
    --ink-3: oklch(0.56 0.008 260);
    --accent: oklch(0.55 0.22 275);
    --accent-soft: oklch(0.96 0.03 275);
    --accent-ink: oklch(0.38 0.18 275);
    --ring: oklch(0.55 0.22 275 / 0.18);
    --ring-ink: oklch(0.18 0.01 260 / 0.08);
    --warn: oklch(0.72 0.15 70);
    --warn-soft: oklch(0.97 0.025 75);
    --warn-line: oklch(0.88 0.07 75);
    --warn-ink: oklch(0.48 0.12 65);
    --ok: oklch(0.62 0.15 155);
    --ok-soft: oklch(0.965 0.025 155);
    --ok-line: oklch(0.87 0.06 155);
    --ok-ink: oklch(0.40 0.12 155);
    --danger: oklch(0.58 0.19 25);
    --danger-soft: oklch(0.97 0.02 25);
    --danger-line: oklch(0.88 0.06 25);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --shadow-1: 0 1px 2px rgba(20,22,40,0.04), 0 1px 1px rgba(20,22,40,0.03);
    --shadow-2: 0 6px 24px rgba(20,22,40,0.06), 0 1px 2px rgba(20,22,40,0.04);
    --shadow-pop: 0 14px 36px rgba(20,22,40,0.11), 0 2px 6px rgba(20,22,40,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; font-size: 13px; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', serif; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.88 0.005 260); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.008 260); border: 3px solid transparent; background-clip: padding-box; }
  .inspiration-tab-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .inspiration-tab-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes df-fade-up {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes df-pop-in {
