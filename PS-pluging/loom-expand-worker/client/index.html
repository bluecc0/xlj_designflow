<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loom Expand Worker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="panel">
    <div class="header-row">
      <div class="title-group">
        <span id="statusDot" class="dot dot--offline"></span>
        <h1 class="title">Expand Worker</h1>
      </div>
      <span id="statusBadge" class="badge">未连接</span>
    </div>

    <div class="meta-row">
      <span id="psVersionText">PS: 检测中...</span>
      <span id="taskStateText">空闲</span>
    </div>

    <section class="card">
      <label class="label" for="serverUrlInput">FastAPI 服务地址</label>
      <input id="serverUrlInput" class="input" type="text" placeholder="http://192.168.1.10:8000" />
      <div class="row-2">
        <div>
          <label class="label" for="workerIdInput">Worker ID</label>
          <input id="workerIdInput" class="input" type="text" placeholder="win-ps-01" />
        </div>
        <div>
          <label class="label" for="tokenInput">Worker Secret</label>
          <input id="tokenInput" class="input" type="password" placeholder="secret" />
        </div>
      </div>
      <button id="saveReconnectBtn" class="btn btn--primary" type="button">保存并重连</button>
    </section>

    <div class="row-2">
      <button id="pauseBtn" class="btn" type="button">暂停接单</button>
      <button id="localTestBtn" class="btn" type="button">本地测试扩图</button>
    </div>

    <section class="card log-card">
      <div class="log-header">
        <span>运行日志（最近 50 条）</span>
        <button id="clearLogBtn" class="link-btn" type="button">清空</button>
      </div>
      <div id="logBox" class="log-box"></div>
    </section>
  </main>

  <script src="./CSInterface.js"></script>
  <script src="./config.js"></script>
  <script src="./host-bridge.js"></script>
  <script src="./worker.js"></script>
</body>
</html>
