<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tldraw Editor Lab</title>
    <script type="module" crossorigin src="./assets/index-IjPhmvAP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DB4tUm7J.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 最早时机响应父页面的 ping，不依赖 React 渲染时序
      const notifyReady = () => {
        try { window.parent.postMessage({ type: 'designflow:editor-ready' }, '*') } catch (e) {}
      }
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'designflow:ping') {
          notifyReady()
        }
      })
      // 模块脚本加载完成后也主动通知一次
      window.addEventListener('load', () => setTimeout(notifyReady, 100))
    </script>
  </body>
</html>
