<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>查看原图</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: #f5f6f8;
        color: #737982;
        font: 13px/1.5 system-ui, sans-serif;
      }
      main {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-width: 0;
      }
      img {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 96px);
        object-fit: contain;
        box-shadow: 0 4px 24px #1e293b12;
      }
      [hidden] { display: none; }
      footer {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 0 24px 20px;
      }
      a { color: inherit; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img id="image" alt="原图" hidden />
      <span id="status" role="status">正在加载原图…</span>
    </main>
    <footer>
      <span id="hint" hidden>右键图片可复制或保存</span>
      <a id="original" hidden>打开图片文件</a>
    </footer>
    <script>
      const params = new URLSearchParams(location.search)
      const image = document.getElementById('image')
      const status = document.getElementById('status')
      const original = document.getElementById('original')
      const hint = document.getElementById('hint')
      async function loadImage() {
        try {
          const src = params.get('src')
          if (!src) throw new Error('missing image')
          const url = new URL(src, location.href)
          if (!['http:', 'https:', 'blob:'].includes(url.protocol) &&
              !(url.protocol === 'data:' && /^data:image\//i.test(src))) {
            throw new Error('invalid image URL')
          }
          const name = params.get('name') || '原图'
          document.title = name
          image.alt = name
          image.onload = () => {
            status.hidden = true
            image.hidden = false
            hint.hidden = false
          }
          image.onerror = () => {
            status.textContent = '图片加载失败，请刷新后重试。'
          }
          original.href = url.href
          original.hidden = false
          let imageUrl = url.href
          const protectedAsset = /^\/(?:ai-images\/|results\/|output\/|compose\/[^/]+\/image\/?$|export\/grid\/)/.test(url.pathname)
          if (url.origin === location.origin && protectedAsset) {
            const response = await fetch('/image-copy/link', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ src: url.pathname + url.search }),
            })
            if (!response.ok) throw new Error(response.status === 401 ? '请先登录系统，再刷新查看原图。' : '原图加载失败，请刷新后重试。')
            const result = await response.json()
            const copyUrl = new URL(result.url, location.origin)
            if (copyUrl.origin !== location.origin || !/^\/image-copy\/original\.(png|jpg|webp|gif|bmp|tiff|avif)$/.test(copyUrl.pathname)) throw new Error('原图链接无效。')
            imageUrl = copyUrl.href
          }
          // 复制出的 HTML 使用单图临时链接，WPS 无需浏览器登录状态即可取图。
          image.src = imageUrl
        } catch (error) {
          status.textContent = error.message === 'missing image' || error.message === 'invalid image URL'
            ? '图片地址无效。' : (error.message || '图片加载失败，请刷新后重试。')
        }
      }
      loadImage()
    </script>
  </body>
</html>
